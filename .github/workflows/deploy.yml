name: Deploy wallet
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-wallet

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, smartlayer]
    steps:
      - name: Pull, build, restart
        working-directory: /home/pi/dev/SmartLayerWallet
        run: |
          git pull --ff-only
          npm ci
          npm test
          npm run build
          sudo systemctl restart smartlayer-wallet
          sudo systemctl restart smartlayer-wallet-https

      - name: Health check
        shell: bash
        run: |
          echo "Waiting for services to start..."
          for i in {1..10}; do
            sleep 3
            if systemctl is-active --quiet smartlayer-wallet && \
               systemctl is-active --quiet smartlayer-wallet-https && \
               curl -fsS http://127.0.0.1:8088/ > /dev/null 2>&1; then
              echo "✓ Services are healthy"
              exit 0
            fi
            echo "Attempt $i/10 - Services not ready yet..."
          done
          
          echo "✗ Health check failed after 30 seconds"
          echo ""
          echo "Service status:"
          systemctl status smartlayer-wallet --no-pager || true
          systemctl status smartlayer-wallet-https --no-pager || true
          echo ""
          echo "Recent logs from smartlayer-wallet:"
          journalctl -u smartlayer-wallet -n 50 --no-pager
          exit 1
