name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test
        env:
          WALLET_DB_PATH: ':memory:'
          CDP_API_KEY: dummy_test_key

      - name: Build
        run: npm run build
        env:
          CDP_API_KEY: dummy_build_key
          WALLET_DB_PATH: ':memory:'
          NEXT_PUBLIC_CDP_API_KEY: pk_test_dummy_key_for_ci_builds
          NEXT_PUBLIC_RP_ID: example.com
          NEXT_PUBLIC_GARAGE_DOOR_NFT_ADDRESS: '0x0000000000000000000000000000000000000000'
          NEXT_PUBLIC_IOT_DEVICE_ADDRESS: '0x0000000000000000000000000000000000000000'
          NEXT_PUBLIC_GARAGE_API_BASE: https://api.example.com
          NEXT_PUBLIC_PAYMASTER_AND_BUNDLER_BASE_SEPOLIA: https://sepolia.base.org
          NEXT_PUBLIC_NODE_RPC_BASE_SEPOLIA: https://sepolia.base.org
          NEXT_PUBLIC_BACKEND_API_URL: https://api.example.com
          NEXT_PUBLIC_RECOVERY_API_BASE: https://api.example.com
